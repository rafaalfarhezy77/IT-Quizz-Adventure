# ==============================================================================
# Sample Nginx Reverse Proxy Configuration untuk IT Quest Adventure (Mythic 3.0)
# Letakkan di /etc/nginx/sites-available/quiz.kampus.ac.id dan symlink ke sites-enabled
# ==============================================================================

# Redirect seluruh traffic HTTP ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name quiz.kampus.ac.id; # Ganti dengan domain atau IP server kampus Anda

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Blok HTTPS (SSL/TLS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quiz.kampus.ac.id; # Ganti dengan domain server kampus Anda

    # Sertifikat SSL (Let's Encrypt atau Sertifikat Resmi Kampus)
    ssl_certificate /etc/letsencrypt/live/quiz.kampus.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.kampus.ac.id/privkey.pem;

    # Rekomendasi Protokol & Cipher Keamanan SSL Modern
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Batas ukuran payload request (untuk upload foto/file BuildCores Hardware)
    client_max_body_size 20M;

    # Reverse proxy ke container Docker yang berjalan di port 5000
    location / {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Header WebSocket / Keepalive jika diperlukan
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout proxy untuk pengerjaan kuis real-time
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Serving static assets langsung melalui Nginx untuk efisiensi tinggi (Opsional)
    # location /static/ {
    #     alias /path/ke/proyek/static/;
    #     expires 7d;
    #     add_header Cache-Control "public, max-age=604800, immutable";
    # }
}
